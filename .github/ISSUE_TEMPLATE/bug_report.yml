name: Bug report
description: Report something that is broken or incorrect
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Before you post this issue, please check the documentation:

        - [rnaseq-splice usage](https://github.com/mattjarvis123/rnaseq-splice/blob/main/docs/splice_usage.md)
        - [nf-core troubleshooting](https://nf-co.re/docs/usage/troubleshooting) for general Nextflow problems
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: command_used
    attributes:
      label: Command used and terminal output
      description: Please paste the command you used to launch the pipeline, your params file if you used one, and the output from your terminal.
      render: console
      placeholder: |
        $ nextflow run mattjarvis123/rnaseq-splice ...

        Some output where something broke

  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: |
        Please drag and drop the relevant files here. Create a `.zip` archive if the extension is not allowed.
        The `.nextflow.log` file in the launch folder (a hidden file) is often useful, as are any custom config files.

  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        * rnaseq-splice version or commit _(eg. 1.0.0)_
        * Nextflow version _(eg. 26.04.6)_
        * Hardware _(eg. laptop, server, HPC, cloud)_
        * Executor _(eg. local, slurm, pbspro)_
        * Container engine _(eg. Docker, Apptainer, Singularity)_
        * OS _(eg. macOS, Ubuntu, Rocky Linux)_
